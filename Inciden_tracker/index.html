<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/icon_facebook.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/icon_seguridad.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>Inciden tracker</title>
</head>

<body>
    <main>
        <article>
            <header>
                <article>

                    <div id="icon">
                        <img src="img/icon_seguridad.png" alt="Icono página">
                        <h1>Inciden tracker</h1>
                    </div>

                    <div id="navBox">
                        <p>NAVEGACIÓN</p>
                    </div>

                    <nav>
                        <ul>
                            <li><a href=""><i class="bi bi-house-door"></i>Inicio</a></li>
                            <li><a href=""><i class="bi bi-box-arrow-in-right"></i>Login</a></li>
                            <li><a href="">Amenazas</a></li>
                            <li><a href=""><i class="bi bi-person-lines-fill"></i>Contacto</a></li>
                        </ul>
                    </nav>
                </article>
            </header>
        </article>

        <section>
            <div class="topbar">
                <div class="topbar-left">
                    <button class="menu-btn"><i class="bi bi-list"></i></button>
                    <input type="text" class="search-input" placeholder="Search...">
                    <button class="search-btn">Search</button>
                </div>
                <div class="topbar-right">
                    <div class="language-dropdown">
                        <button class="dropdown-btn">English <i class="bi bi-caret-down-fill"></i></button>
                        <ul class="dropdown-menu">
                            <li data-lang="English">English</li>
                            <li data-lang="Spanish">Spanish</li>
                            <li data-lang="Italian">Italian</li>
                            <li data-lang="Russian">Russian</li>
                        </ul>
                    </div>

                    <button class="notification-btn">
                        <span class="notification-dot"></span><i class="bi bi-bell-fill"></i>
                    </button>
                    <button class="dark-mode-btn"><i class="bi bi-moon"></i></button>
                    <button class="fullscreen-btn"><i class="bi bi-arrows-fullscreen"></i></button>
                </div>
            </div>
        </section>

    </main>
    <script src="js/script.js" defer></script>
</body>

</html>
